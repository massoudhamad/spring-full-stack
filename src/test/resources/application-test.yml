# Tests run against a real PostgreSQL, on a separate database.
#
#   createdb pis_test --owner=pis
#
# Not H2. H2 accepts SQL that PostgreSQL rejects, so a green H2 suite tells you
# very little about the database you actually deploy to.
spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/pis_test}
    username: ${TEST_DB_USER:pis}
    password: ${TEST_DB_PASSWORD:pis_dev}

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
